[project]
name = "crack-segmentation-weakly-supervised"
version = "0.1.0"
description = "Crack segmentation trained on image level labels only"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",  # line length
]
